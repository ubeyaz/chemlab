<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChemLab Studio | Grade 10 — Unit 1: Skills</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
    body { font-family: 'Inter', sans-serif; }
    code, pre, .font-mono { font-family: 'JetBrains Mono', monospace; }
    .fade-in { animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <!-- Top Header -->
  <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <button id="mobileMenuBtn" class="lg:hidden p-2 rounded-lg text-slate-300 hover:bg-slate-800" aria-label="Toggle Menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="w-9 h-9 rounded-xl bg-teal-500/20 border border-teal-400/30 flex items-center justify-center text-teal-300 font-bold text-lg">
          ⚗️
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-base sm:text-lg tracking-tight">ChemLab Studio</h1>
            <span class="text-[11px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-teal-500/20 text-teal-300 border border-teal-500/30">Grade 10 • Unit 1</span>
          </div>
          <p class="text-xs text-slate-400 hidden sm:block">Interactive Workbook Mastery &amp; Diagnostic Feedback</p>
        </div>
      </div>

      <div class="flex items-center gap-3 sm:gap-5">
        <div class="hidden md:flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
          <span class="text-xs text-slate-400">Unit Mastery:</span>
          <div class="w-24 h-2 bg-slate-700 rounded-full overflow-hidden">
            <div id="globalProgressBar" class="h-full bg-teal-400 transition-all duration-500" style="width: 0%"></div>
          </div>
          <span id="globalProgressText" class="text-xs font-bold text-teal-300">0%</span>
        </div>
        <button onclick="launchFullUnitExam()" class="px-3.5 py-2 rounded-lg bg-teal-500 hover:bg-teal-400 text-slate-950 font-semibold text-xs sm:text-sm transition shadow-sm flex items-center gap-1.5">
          <span>🎯</span> <span>Unit 1 Exam</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="flex-1 max-w-7xl w-full mx-auto flex relative">
    <!-- Sidebar Backdrop -->
    <div id="sidebarBackdrop" class="fixed inset-0 bg-slate-900/50 z-20 hidden lg:hidden" onclick="toggleSidebar(false)"></div>

    <!-- Left Sidebar: 14 Workbook Topics -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-20 w-72 bg-white border-r border-slate-200 transform -translate-x-full lg:translate-x-0 transition-transform duration-200 flex flex-col h-[calc(100vh-4rem)] top-16">
      <div class="p-4 border-b border-slate-100 flex items-center justify-between">
        <div>
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Workbook Curriculum</h2>
          <p class="text-xs text-slate-500 mt-0.5">Select a topic to study or practice</p>
        </div>
        <button onclick="resetProgress()" title="Reset saved scores" class="text-xs text-slate-400 hover:text-rose-600 transition">Reset</button>
      </div>
      <nav id="topicList" class="flex-1 overflow-y-auto p-2.5 space-y-1"></nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto min-w-0">
      <!-- Topic Header & Mode Switcher -->
      <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm mb-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div>
            <div class="flex items-center gap-2 text-xs font-semibold text-teal-700 mb-1">
              <span id="topicBadge" class="px-2.5 py-0.5 rounded-md bg-teal-50 border border-teal-200">Section 1.1</span>
              <span id="topicMasteryBadge" class="px-2.5 py-0.5 rounded-md bg-slate-100 text-slate-600">0/0 Mastered</span>
            </div>
            <h2 id="topicTitle" class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">States of Matter</h2>
            <p id="topicSubtitle" class="text-sm text-slate-600 mt-1">Particle arrangement, intermolecular forces, kinetic energy, and phase transitions.</p>
          </div>

          <!-- 3-Mode Tabs -->
          <div class="inline-flex p-1 bg-slate-100 rounded-xl border border-slate-200 self-start">
            <button id="tab-learn" onclick="setMode('learn')" class="mode-tab px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 bg-white text-slate-900 shadow-sm">
              <span>📘</span> Learn
            </button>
            <button id="tab-practice" onclick="setMode('practice')" class="mode-tab px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 text-slate-600 hover:text-slate-900">
              <span>🧪</span> Practice
            </button>
            <button id="tab-test" onclick="setMode('test')" class="mode-tab px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 text-slate-600 hover:text-slate-900">
              <span>⏱️</span> Self-Test
            </button>
          </div>
        </div>
      </div>

      <!-- Dynamic View Container -->
      <div id="viewContainer" class="fade-in
