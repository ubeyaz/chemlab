    // =========================================================================
    // STATE & PERSISTENCE
    // =========================================================================
    let currentTopicId = "1.1";
    let currentMode = "learn";
    let questionFilter = "ALL"; // ALL | A | B
    let practiceIdx = 0;
    let selectedOption = null;
    let testState = null;

    let mastery = JSON.parse(localStorage.getItem("chemlab_g10_u1_mastery_v2") || "{}");

    function saveMastery() {
      localStorage.setItem("chemlab_g10_u1_mastery_v2", JSON.stringify(mastery));
      updateGlobalProgress();
      renderSidebar();
    }

    function resetProgress() {
      if (confirm("Reset all saved mastery progress for Unit 1?")) {
        mastery = {};
        saveMastery();
        renderView();
      }
    }

    function updateGlobalProgress() {
      let totalQ = 0, masteredQ = 0;
      TOPICS.forEach(t => {
        totalQ += t.questions.length;
        masteredQ += (mastery[t.id] || []).length;
      });
      const pct = totalQ ? Math.round((masteredQ / totalQ) * 100) : 0;
      document.getElementById("globalProgressBar").style.width = pct + "%";
      document.getElementById("globalProgressText").textContent = pct + "%";
    }

    // =========================================================================
    // SIDEBAR & NAVIGATION
    // =========================================================================
    function toggleSidebar(open) {
      const sb = document.getElementById("sidebar");
      const bd = document.getElementById("sidebarBackdrop");
      if (open) {
        sb.classList.remove("-translate-x-full");
        bd.classList.remove("hidden");
      } else {
        sb.classList.add("-translate-x-full");
        bd.classList.add("hidden");
      }
    }
    document.getElementById("mobileMenuBtn").addEventListener("click", () => toggleSidebar(true));

    function renderSidebar() {
      const list = document.getElementById("topicList");
      list.innerHTML = TOPICS.map(t => {
        const active = t.id === currentTopicId && !testState?.isFullExam;
        const done = (mastery[t.id] || []).length;
        const total = t.questions.length;
        const complete = done === total && total > 0;
        return `
          <button onclick="selectTopic('${t.id}')" class="w-full text-left px-3 py-2.5 rounded-xl flex items-center justify-between gap-2 transition ${active ? 'bg-teal-50 text-teal-900 border border-teal-200 font-semibold' : 'text-slate-700 hover:bg-slate-100'}">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="text-xs font-mono px-1.5 py-0.5 rounded ${active ? 'bg-teal-600 text-white' : 'bg-slate-200/80 text-slate-700'}">${t.id}</span>
              <span class="text-sm truncate">${t.title}</span>
            </div>
            <span class="text-xs font-semibold shrink-0 ${complete ? 'text-emerald-600' : 'text-slate-400'}">
              ${complete ? '✓' : `${done}/${total}`}
            </span>
          </button>
        `;
      }).join("");
    }

    function selectTopic(id) {
      currentTopicId = id;
      testState = null;
      questionFilter = "ALL";
      practiceIdx = 0;
      selectedOption = null;
      toggleSidebar(false);
      renderSidebar();
      renderView();
    }

    function setMode(mode) {
      currentMode = mode;
      testState = null;
      practiceIdx = 0;
      selectedOption = null;
      renderView();
    }

    function setQuestionFilter(filter) {
      questionFilter = filter;
      practiceIdx = 0;
      selectedOption = null;
      renderView();
    }

    function jumpToPracticeQuestion(idx) {
      practiceIdx = idx;
      selectedOption = null;
      renderView();
    }

    // =========================================================================
    // VIEW RENDERING
    // =========================================================================
    function renderView() {
      const topic = TOPICS.find(t => t.id === currentTopicId);

      if (testState && testState.isFullExam) {
        document.getElementById("topicBadge").textContent = "Cumulative Final Exam";
        document.getElementById("topicTitle").textContent = "Unit 1: Comprehensive Skills Exam";
        document.getElementById("topicSubtitle").textContent = "Mixed diagnostic assessment across all 14 workbook sections.";
        document.getElementById("topicMasteryBadge").textContent = `${testState.questions.length} Questions`;
      } else {
        const done = (mastery[topic.id] || []).length;
        document.getElementById("topicBadge").textContent = `Section ${topic.id}`;
        document.getElementById("topicTitle").textContent = topic.title;
        document.getElementById("topicSubtitle").textContent = topic.subtitle;
        document.getElementById("topicMasteryBadge").textContent = `${done}/${topic.questions.length} Mastered`;
      }

      ["learn", "practice", "test"].forEach(m => {
        const btn = document.getElementById(`tab-${m}`);
        const isActive = (!testState?.isFullExam && currentMode === m) || (testState?.isFullExam && m === "test");
        btn.className = isActive
          ? "mode-tab px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 bg-white text-slate-900 shadow-sm"
          : "mode-tab px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 text-slate-600 hover:text-slate-900";
      });

      const container = document.getElementById("viewContainer");
      if (testState) {
        renderTestView(container);
      } else if (currentMode === "learn") {
        renderLearnView(container, topic);
      } else if (currentMode === "practice") {
        renderPracticeView(container, topic);
      } else {
        startTopicTest(topic);
      }
    }

    // --- PRACTICE MODE (QUESTION SET SELECTOR + DIAGNOSTIC FEEDBACK) ---
    function getFilteredQuestions(topic) {
      return topic.questions
        .map((q, originalIdx) => ({ ...q, originalIdx }))
        .filter(q => questionFilter === "ALL" || q.set === questionFilter);
    }

      const filtered = getFilteredQuestions(topic);
      if (practiceIdx >= filtered.length) practiceIdx = 0;
      const q = filtered[practiceIdx];
      const letters = ["A", "B", "C", "D"];
      const masteredList = mastery[topic.id] || [];

      container.innerHTML = `
        <div class="max-w-3xl space-y-4">
          <!-- Question Set Picker Bar -->
          <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="text-xs font-bold uppercase tracking-wider text-slate-400 mr-1">Question Set:</span>
              <button onclick="setQuestionFilter('ALL')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${questionFilter === 'ALL' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                All (${topic.questions.length})
              </button>
              <button onclick="setQuestionFilter('A')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${questionFilter === 'A' ? 'bg-teal-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                Set A: Core Skills (${topic.questions.filter(x => x.set === 'A').length})
              </button>
              <button onclick="setQuestionFilter('B')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${questionFilter === 'B' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                Set B: Exam &amp; Visuals (${topic.questions.filter(x => x.set === 'B').length})
              </button>
            </div>

            <!-- Numbered Quick-Jump Pills -->
            <div class="flex flex-wrap items-center gap-1.5">
              ${filtered.map((item, idx) => {
                const isDone = masteredList.includes(item.originalIdx);
                const isCurrent = idx === practiceIdx;
                let pillClass = "bg-slate-100 text-slate-600 hover:bg-slate-200";
                if (isCurrent) pillClass = "bg-teal-600 text-white ring-2 ring-teal-500/30";
                else if (isDone) pillClass = "bg-emerald-100 text-emerald-800 border border-emerald-300";
                return `<button onclick="jumpToPracticeQuestion(${idx})" class="w-7 h-7 rounded-lg text-xs font-bold transition ${pillClass}">${idx + 1}</button>`;
              }).join("")}
            </div>
          </div>

          <!-- Active Question Card -->
          <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-8 shadow-sm">
            <div class="flex items-center justify-between text-xs font-semibold text-slate-500 mb-4 pb-3 border-b border-slate-100">
              <div class="flex items-center gap-2">
                <span>Question ${practiceIdx + 1} of ${filtered.length}</span>
                <span class="px-2 py-0.5 rounded text-[11px] font-bold ${q.set === 'A' ? 'bg-teal-50 text-teal-700' : 'bg-indigo-50 text-indigo-700'}">
                  ${q.set === 'A' ? 'Set A • Core' : 'Set B • Challenge'}
                </span>
              </div>
              <span class="text-teal-700 bg-teal-50 px-2.5 py-1 rounded-md">Instant Misconception Feedback</span>
            </div>

            ${q.diagram ? `<div class="mb-5">${q.diagram}</div>` : ''}

            <h3 class="text-lg sm:text-xl font-bold text-slate-900 leading-snug mb-6">${q.q}</h3>

            <div class="space-y-3">
              ${q.options.map((opt, idx) => {
                let cardStyle = "border-slate-200 hover:border-teal-400 hover:bg-slate-50";
                let badgeStyle = "bg-slate-100 text-slate-700";
                if (selectedOption !== null) {
                  if (idx === selectedOption) {
                    cardStyle = opt.correct ? "border-emerald-500 bg-emerald-50/70 ring-2 ring-emerald-500/20" : "border-rose-500 bg-rose-50/70 ring-2 ring-rose-500/20";
                    badgeStyle = opt.correct ? "bg-emerald-600 text-white" : "bg-rose-600 text-white";
                  } else if (opt.correct) {
                    cardStyle = "border-emerald-400 bg-emerald-50/40";
                    badgeStyle = "bg-emerald-600 text-white";
                  } else {
                    cardStyle = "border-slate-200 opacity-60";
                  }
                }
                return `
                  <button onclick="choosePracticeOption(${idx}, ${q.originalIdx})" class="w-full text-left p-4 rounded-xl border-2 transition flex items-start gap-3.5 ${cardStyle}">
                    <span class="w-7 h-7 rounded-lg font-bold text-xs flex items-center justify-center shrink-0 mt-0.5 ${badgeStyle}">${letters[idx]}</span>
                    <span class="text-sm sm:text-base font-medium text-slate-800">${opt.text}</span>
                  </button>
                `;
              }).join("")}
            </div>

            ${selectedOption !== null ? `
              <div class="mt-6 p-5 rounded-xl border ${q.options[selectedOption].correct ? 'bg-emerald-50 border-emerald-200 text-emerald-950' : 'bg-rose-50 border-rose-200 text-rose-950'} fade-in">
                <div class="font-bold text-sm uppercase tracking-wider mb-1 flex items-center gap-2">
                  <span>${q.options[selectedOption].correct ? '✅ Correct!' : '🔍 Why That Choice Is Incorrect'}</span>
                </div>
                <p class="text-sm leading-relaxed mb-3">${q.options[selectedOption].feedback}</p>
                <div class="text-xs bg-white/80 p-3 rounded-lg border border-black/5 text-slate-700">
                  <strong>Key Takeaway:</strong> ${q.explanation}
                </div>
              </div>
            ` : ''}

            <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between">
              <button onclick="prevPractice()" ${practiceIdx === 0 ? 'disabled' : ''} class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-100 disabled:opacity-40">← Previous</button>
              ${practiceIdx < filtered.length - 1 ? `
                <button onclick="nextPractice()" class="px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold transition">Next Question →</button>
              ` : `
                <button onclick="setMode('test')" class="px-5 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-sm font-semibold transition">Take ${topic.id} Self-Test →</button>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function choosePracticeOption(idx, originalIdx) {
      selectedOption = idx;
      const topic = TOPICS.find(t => t.id === currentTopicId);
      if (topic.questions[originalIdx].options[idx].correct) {
        if (!mastery[topic.id]) mastery[topic.id] = [];
        if (!mastery[topic.id].includes(originalIdx)) {
          mastery[topic.id].push(originalIdx);
          saveMastery();
        }
      }
      renderView();
    }

    function nextPractice() {
      const topic = TOPICS.find(t => t.id === currentTopicId);
      const filtered = getFilteredQuestions(topic);
      if (practiceIdx < filtered.length - 1) {
        practiceIdx++;
        selectedOption = null;
        renderView();
      }
    }

    function prevPractice() {
      if (practiceIdx > 0) {
        practiceIdx--;
        selectedOption = null;
        renderView();
      }
    }

    // --- SELF-TEST & UNIT FINAL EXAM MODE ---
    function startTopicTest(topic) {
      testState = {
        isFullExam: false,
        questions: topic.questions.map(q => ({ ...q, topicId: topic.id, topicTitle: topic.title })),
        answers: {},
        submitted: false
      };
      renderView();
    }

    function launchFullUnitExam() {
      const pool = [];
      TOPICS.forEach(t => {
        const shuffled = [...t.questions].sort(() => Math.random() - 0.5);
        shuffled.slice(0, 2).forEach(pick => {
          pool.push({ ...pick, topicId: t.id, topicTitle: t.title });
        });
      });
      testState = {
        isFullExam: true,
        questions: pool,
        answers: {},
        submitted: false
      };
      toggleSidebar(false);
      renderSidebar();
      renderView();
    }

    function selectTestAnswer(qIdx, optIdx) {
      if (testState.submitted) return;
      testState.answers[qIdx] = optIdx;
      renderView();
    }

    function submitTest() {
      testState.submitted = true;
      renderView();
    }

    function renderTestView(container) {
      const letters = ["A", "B", "C", "D"];
      const total = testState.questions.length;
      const answeredCount = Object.keys(testState.answers).length;

      let score = 0;
      if (testState.submitted) {
        testState.questions.forEach((q, i) => {
          const chosen = testState.answers[i];
          if (chosen !== undefined && q.options[chosen]?.correct) score++;
        });
      }

      container.innerHTML = `
        <div class="max-w-3xl space-y-6">
          ${testState.submitted ? `
            <div class="bg-slate-900 text-white rounded-2xl p-6 shadow-md flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
              <div>
                <div class="text-xs font-bold uppercase tracking-wider text-teal-400">Assessment Complete</div>
                <h3 class="text-2xl font-extrabold mt-1">Score: ${score} / ${total} (${Math.round((score / total) * 100)}%)</h3>
                <p class="text-sm text-slate-300 mt-1">Review each question below to inspect why incorrect options fail.</p>
              </div>
              <button onclick="${testState.isFullExam ? 'launchFullUnitExam()' : 'setMode(\'test\')'}" class="px-4 py-2.5 rounded-xl bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold text-sm shrink-0">Retake Test</button>
            </div>
          ` : `
            <div class="bg-white rounded-xl border border-slate-200 px-5 py-3.5 flex items-center justify-between sticky top-16 z-10 shadow-sm">
              <span class="text-sm font-semibold text-slate-700">Answered: ${answeredCount} of ${total}</span>
              <button onclick="submitTest()" ${answeredCount < total ? 'disabled' : ''} class="px-5 py-2 rounded-lg bg-teal-600 hover:bg-teal-500 disabled:bg-slate-300 text-white text-sm font-semibold transition">
                Submit &amp; Grade
              </button>
            </div>
          `}

          ${testState.questions.map((q, qIdx) => {
            const chosen = testState.answers[qIdx];
            return `
              <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm">
                <div class="flex items-center justify-between text-xs font-semibold text-slate-400 mb-2">
                  <span>Question ${qIdx + 1}</span>
                  <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-600">${q.topicId} ${q.topicTitle}</span>
                </div>
                ${q.diagram ? `<div class="my-4">${q.diagram}</div>` : ''}
                <h4 class="text-base sm:text-lg font-bold text-slate-900 mb-4">${q.q}</h4>
                <div class="space-y-2.5">
                  ${q.options.map((opt, oIdx) => {
                    let style = chosen === oIdx ? "border-teal-600 bg-teal-50/60" : "border-slate-200 hover:bg-slate-50";
                    if (testState.submitted) {
                      if (opt.correct) style = "border-emerald-500 bg-emerald-50/70";
                      else if (chosen === oIdx) style = "border-rose-500 bg-rose-50/70";
                      else style = "border-slate-200 opacity-60";
                    }
                    return `
                      <button onclick="selectTestAnswer(${qIdx}, ${oIdx})" class="w-full text-left p-3.5 rounded-xl border-2 transition flex items-center gap-3 ${style}">
                        <span class="w-6 h-6 rounded-md bg-slate-100 text-slate-700 font-bold text-xs flex items-center justify-center shrink-0">${letters[oIdx]}</span>
                        <span class="text-sm font-medium text-slate-800">${opt.text}</span>
                      </button>
                    `;
                  }).join("")}
                </div>

                ${testState.submitted ? `
                  <div class="mt-4 p-4 rounded-xl text-sm ${q.options[chosen]?.correct ? 'bg-emerald-50 text-emerald-950 border border-emerald-200' : 'bg-rose-50 text-rose-950 border border-rose-200'}">
                    <strong>${q.options[chosen]?.correct ? '✅ Correct:' : '❌ Diagnostic Feedback:'}</strong> ${q.options[chosen]?.feedback || 'No answer selected.'}
                  </div>
                ` : ''}
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    // Boot
    updateGlobalProgress();
    renderSidebar();
    renderView();
  </script>
</body>
</html>
